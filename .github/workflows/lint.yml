name: Build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: jdx/mise-action@v2   # installiert bun + node aus mise.toml
            - run: bun install --frozen-lockfile
            - run: bun run build
            - run: bun run lint
            - run: bun run test
